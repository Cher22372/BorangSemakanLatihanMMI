<!DOCTYPE html>

                        <select id="namaMurid" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" required disabled>

                    <!-- Jumlah Murid dalam Kelas (Info sahaja) -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-400 mb-1">Jumlah Murid Dipilih</label>
                        <input type="text" id="jumlahMurid" value="1 / --" class="w-full border border-gray-200 rounded-lg p-2.5 bg-gray-100 text-gray-500 cursor-not-allowed" readonly>
                    </div>
                </div>
            </div>

            <hr class="border-gray-200">

            <!-- Bahagian Penilaian & Ulasan -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Skor Semakan -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Skor Penilaian</label>
                    <select id="skor" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" required>
                        <option value="">-- Pilih Skor --</option>
                        <option value="Perlu Diperbaiki">Perlu Diperbaiki</option>
                        <option value="Memuaskan">Memuaskan</option>

                        <option value="Cemerlang">Cemerlang</option>
                    </select>
                </div>

                <!-- Nama Penyemak -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Penyemak</label>
                    <input type="text" id="namaPenyemak" placeholder="Nama Guru Kanan / Pentadbir" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" required>
                </div>
            </div>

            <div>
                <!-- Ulasan Penyemak -->
                <label class="block text-sm font-semibold text-gray-700 mb-1">Ulasan Penyemak</label>
                <textarea id="ulasanPenyemak" rows="3" placeholder="Sila berikan maklum balas atau cadangan penambahbaikan..." class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"></textarea>
            </div>

            <!-- Butang Hantar -->
            <div class="pt-4">
                <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                    Simpan / Hantar Semakan
                </button>
            </div>
        </form>
    </div>
